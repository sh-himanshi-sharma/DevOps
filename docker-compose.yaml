version: '3.8'

services:
  web:
    build: .
    container_name: compose-web
    ports:
      - "8080:3000"
    environment:
      - VERSION=compose-v1
    depends_on:
      - redis
    networks:
      - app-net

  redis:
    image: redis:7-alpine
    container_name: compose-redis
    ports:
      - "6379:6379"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge