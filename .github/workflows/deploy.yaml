name: CI/CD to Kubernetes

on:
  push:
    branches: [ main ]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ env.IMAGE_NAME }}:latest

    - name: Install kind
      run: |
        curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.22.0/kind-linux-amd64
        chmod +x ./kind
        sudo mv ./kind /usr/local/bin/kind

    - name: Create kind cluster
      run: kind create cluster --name ci-cluster

    - name: Apply manifests
      run: |
        kubectl create namespace rollout-lab || true
        kubectl apply -f k8s/deployment.yaml -n rollout-lab
        kubectl apply -f k8s/service.yaml -n rollout-lab

    - name: Trigger rolling update
      run: |
        kubectl set image deployment/k8s-demo \
          k8s-demo=${{ env.IMAGE_NAME }}:${{ github.sha }} -n rollout-lab
        kubectl annotate deployment/k8s-demo \
          kubernetes.io/change-cause="CI: commit ${{ github.sha }} (run ${{ github.run_number }})" \
          -n rollout-lab --overwrite

    - name: Wait for rollout
      run: kubectl rollout status deployment/k8s-demo -n rollout-lab --timeout=300s

    - name: Auto rollback on failure
      if: failure()
      run: kubectl rollout undo deployment/k8s-demo -n rollout-lab
